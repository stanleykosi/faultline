services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: faultline_migration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: faultline
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline_migration -d faultline"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:

